[project]
name = "calibre-mcp"
version = "0.1.0"
description = "MCP server (stdio) to manage a Calibre ebook library: fast SQLite reads, integrity-safe calibredb writes."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
calibre-mcp = "calibre_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibre_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests (pure functions, tmp dirs)",
    "integration: tests that hit SQLite or the calibredb subprocess",
    "e2e: end-to-end tests driving the FastMCP tool surface",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# The mcp SDK ships partial stubs; don't fail the whole check on its internals.
[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
# FastMCP reads each @mcp.tool()/@mcp.resource() return annotation to shape the
# wire response: a bare `dict` serializes to a single TextContent (the shipped
# contract), while `dict[str, Any]` flips it to structured content — an
# outward-facing change. So the tool signatures here stay bare `dict` on
# purpose; exempt only this module from disallow_any_generics.
[[tool.mypy.overrides]]
module = "calibre_mcp.server"
disallow_any_generics = false
